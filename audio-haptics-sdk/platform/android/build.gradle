// SPDX-License-Identifier: Apache-2.0

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

group = 'com.moonlight.haptics'
version = '0.5.14-SNAPSHOT'

android {
    namespace 'com.moonlight.haptics.android'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        minSdk 22
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles 'consumer-rules.pro'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -Wall -Wextra -Wpedantic -Wconversion -Wshadow'
            }
        }
    }

    buildFeatures {
        buildConfig false
        prefabPublishing true
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }

    prefab {
        moonlight_haptics_android {
            headers 'src/main/cpp/include'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = project.group
            artifactId = 'moonlight-haptics-android'
            version = project.version

            afterEvaluate {
                from components.release
            }
        }
    }
}
